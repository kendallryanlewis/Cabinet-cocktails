name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build
        run: >-
          xcodebuild build
          -project "Cocktail-bar.xcodeproj"
          -scheme "Cocktail-bar"
          -destination "platform=iOS Simulator,name=iPhone 16,OS=latest"
          CODE_SIGN_IDENTITY=""
          CODE_SIGNING_REQUIRED=NO

      - name: Run Tests
        run: >-
          xcodebuild test
          -project "Cocktail-bar.xcodeproj"
          -scheme "Cocktail-bar"
          -destination "platform=iOS Simulator,name=iPhone 16,OS=latest"
          CODE_SIGN_IDENTITY=""
          CODE_SIGNING_REQUIRED=NO
